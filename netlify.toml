# Deploy da Açaiteria MR no Netlify.
#
# O site fica em site/, não na raiz do repositório, por isso o `base`.
#
# ATENÇÃO ao `publish`: com `base` definido, o Netlify entra nessa pasta antes
# de tudo e resolve o publish a partir dela. Por isso é "dist" e não
# "site/dist": este último vira site/site/dist e o deploy falha com
# "Deploy directory does not exist".
#
# O roteamento do SPA (/sistema resolvido no cliente) fica em
# site/public/_redirects, para não haver duas fontes da mesma regra.

[build]
  base = "site"
  command = "npm run build"
  publish = "dist"

# As funções servidor do pagamento. O caminho é relativo ao `base`, então
# aponta para site/netlify/functions. Elas existem porque o link de cobrança
# precisa nascer do total que está no banco, e não do que o navegador diz.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[build.environment]
  # Vite 7 exige Node 20.19+ ou 22.12+. Fixado para o deploy não mudar sozinho.
  NODE_VERSION = "22"

# Deploy de preview nas pull requests, com o mesmo build da produção.
[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"

# Segurança em tudo. Sem Cache-Control aqui de propósito: o padrão do Netlify
# para HTML já é revalidar sempre, e definir nas duas regras entraria em
# conflito com o cache dos assets abaixo.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

    # HSTS: uma vez visitado por HTTPS, o navegador se recusa a voltar para
    # HTTP neste domínio. Sem preload de propósito — entrar na lista dos
    # navegadores é praticamente irreversível e prende também os subdomínios.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

    # CSP: a rede de proteção para o dia em que algum texto do banco escapar
    # para a tela. Hoje o React escapa tudo sozinho e não existe innerHTML em
    # lugar nenhum, mas isso é uma linha de código de distância de mudar.
    #
    # O que cada origem faz aqui:
    #   supabase.co       banco, login e realtime (o wss é o pedido novo
    #                     chegando no painel sem recarregar)
    #   fonts.googleapis  folha de estilo da fonte Outfit, carregada no <head>
    #   fonts.gstatic     os arquivos .woff2 dessa fonte
    #
    # 'unsafe-inline' em style-src é exigência do Framer Motion, que anima
    # escrevendo style inline no elemento. Em script-src não entra: é lá que
    # 'unsafe-inline' desmontaria a proteção inteira.
    #
    # frame-ancestors 'self' é o X-Frame-Options acima escrito na linguagem que
    # os navegadores atuais realmente leem; os dois ficam, para os antigos.
    # img-src era `https:`, ou seja, imagem de qualquer servidor do mundo. Isso
    # esvazia a defesa: um texto que escape para a tela vira <img src="http://
    # servidor-de-alguem/?dados"> e leva junto o que estiver na página. As
    # fotos do cardápio moram em dois lugares só, o próprio site e o Storage do
    # Supabase, e é isso que fica liberado.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://kvmjefhxyvtcaiiqzboh.supabase.co; connect-src 'self' https://kvmjefhxyvtcaiiqzboh.supabase.co wss://kvmjefhxyvtcaiiqzboh.supabase.co; form-action 'self'; frame-src 'none'; worker-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'"

    # A aba aberta pelo site (WhatsApp, comprovante, checkout) não fica com uma
    # referência viva para esta página. Já usamos noopener em cada window.open;
    # aqui a regra passa a valer para o site inteiro, inclusive para o que for
    # escrito amanhã.
    Cross-Origin-Opener-Policy = "same-origin"

# Os assets levam hash no nome, então podem ser cacheados para sempre.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/imagem/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# As funções de pagamento não são página: resposta delas não se guarda em
# cache nem entra em buscador.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow"
